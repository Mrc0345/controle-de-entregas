<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Entregas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Controle de Entregas</h1>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input type="password" id="senha" placeholder="Digite a senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- SISTEMA -->
<div id="sistema" style="display:none;">

  <h2>Cadastro de Mercadoria</h2>
  <input id="nome" placeholder="Nome">
  <input id="codigo" placeholder="Código">
  <input id="peso" placeholder="Peso">
  <input id="tipo" placeholder="Tipo">
  <input id="descricao" placeholder="Descrição">
  <button onclick="cadastrarMercadoria()">Cadastrar</button>

  <h2>Cadastro de Endereço</h2>
  <input id="logradouro" placeholder="Logradouro">
  <input id="complemento" placeholder="Complemento">
  <input id="numero" placeholder="Número">
  <input id="cep" placeholder="CEP">
  <input id="cidade" placeholder="Cidade">
  <input id="estado" placeholder="Estado">
  <button onclick="cadastrarEndereco()">Cadastrar</button>

  <h2>Vincular</h2>
  <button onclick="vincular()">Vincular Mercadoria ao Endereço</button>

  <h2>Dados</h2>
  <pre id="resultado"></pre>

</div>

<script src="script.js"></script>
</body>
</html>
